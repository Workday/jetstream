# Production job parameters.
#
# Control-plane rows land in:     metadata_prod.jetstream.*
# Destination tables land in:     raw_prod.wss.<object>
#
# metadata_catalog and metadata_schema overrides are rejected when
# environment=prod. Production uses metadata_prod.jetstream.

environment: prod
instance_name: wss
metadata_catalog: metadata_prod
metadata_schema: jetstream
destination_catalog: raw_prod
destination_schema: wss
secret_scope: jetstream_wss
owner_team: data-platform
sla_target_minutes: "1440"
is_sandbox: "false"

attachment_volume_base: /Volumes/raw_prod/wss/attachments
raw_json_volume_base: /Volumes/raw_prod/wss/api_responses
download_attachments: "true"
page_size: "100"
lookback_minutes: "30"
retry_max_attempts: "5"

enabled_objects: contracts,projects,events
primary_key: id
watermark_column: updated_at

from_datetime: ""
to_datetime: ""
mode: run
trigger_type: scheduled
