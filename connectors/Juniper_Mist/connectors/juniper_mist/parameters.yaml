# Jetstream Juniper Mist connector — parameter schema.
#
# Spec §7 "Parameter Specification Convention": this file is the single
# source of truth for what the connector's source_config accepts.
# At first run, this file is compiled into a JSON Schema and inserted as
# metadata_<env>.jetstream.connector_manifest.config_schema.
#
# Per-instance values are set through Databricks Job UI parameters and
# read via dbutils.widgets.getAll() — NOT stored anywhere in this repo.
# See docs/examples/ for reference parameter sets.

parameters:

  # -------------------------------------------------------------------
  # Platform routing (identical across all connectors)
  # -------------------------------------------------------------------

  - name: environment
    type: string
    required: true
    enum: [dev, prod]
    description: >-
      Which Jetstream metadata catalog this instance reports to.
      dev  -> metadata_dev
      prod -> metadata_prod
      Also written to connector_instance.environment.

  - name: instance_name
    type: string
    required: true
    description: >-
      Human-readable name for this deployment, unique within the metadata
      catalog. Example: juniper_mist.

  - name: destination_catalog
    type: string
    required: true
    description: Unity Catalog where raw Juniper Mist tables are written (e.g. raw_dev).

  - name: destination_schema
    type: string
    required: true
    description: Schema under destination_catalog (e.g. juniper_mist).

  - name: metadata_catalog
    type: string
    required: false
    default: ""
    description: >-
      Which catalog holds the Jetstream control-plane tables. Empty means the
      spec default (metadata_dev for env=dev, metadata_prod
      for env=prod). Override only in dev sandbox phase (e.g. raw_dev when
      the shared metadata catalog is not yet provisioned). Overrides rejected in prod.

  - name: metadata_schema
    type: string
    required: false
    default: jetstream
    description: >-
      Which schema under metadata_catalog this instance reports to. Default
      'jetstream' is the shared control-plane schema every prod-ready connector
      uses. Developers iterating on a new connector type MUST override this to
      'jetstream_juniper_mist' per spec §3.2, to keep test/throwaway rows out
      of the shared schema. Overrides permitted only when environment='dev';
      the value must still start with 'jetstream'.

  - name: sla_target_minutes
    type: integer
    required: false
    default: 1440
    description: Expected maximum minutes between successful runs; used by the connector_health view.

  - name: owner_team
    type: string
    required: false
    default: ""
    description: Team that owns this instance (informational).

  # -------------------------------------------------------------------
  # Juniper Mist authentication (scope name only; values in secrets)
  # -------------------------------------------------------------------

  - name: secret_scope
    type: string
    required: true
    description: >-
      Databricks secret scope that holds this instance's Juniper Mist credentials.
      Required key: juniper_mist_token (the API token value).
      Optional keys (used as fallback if the widget is left empty):
        juniper_mist_org_id, juniper_mist_base_url.
      Values are NEVER written to the control plane — only the scope name.

  - name: juniper_mist_org_id
    type: string
    required: true
    description: >-
      Juniper Mist organization UUID. Not a credential; stored as a widget parameter.
      Example: 00000000-0000-0000-0000-000000000000. Replace with your org UUID.

  - name: juniper_mist_base_url
    type: string
    required: false
    default: https://api.mist.com/api/v1
    description: >-
      Juniper Mist API base URL (includes /api/v1). Change for non-US regions.
      Options: https://api.mist.com/api/v1 | https://api.eu.mist.com/api/v1
               https://api.ac2.mist.com/api/v1 | https://api.gc1.mist.com/api/v1

  # -------------------------------------------------------------------
  # HTTP tuning
  # -------------------------------------------------------------------

  - name: rate_limit_qps
    type: number
    required: false
    default: 5
    description: >-
      Client-side token-bucket rate limit (requests/second). Shared across all
      fan-out worker threads. Reduce to 2-3 for orgs with 100+ sites.

  - name: timeout_seconds
    type: integer
    required: false
    default: 60
    description: Per-HTTP-request timeout in seconds.

  - name: retry_max_attempts
    type: integer
    required: false
    default: 5
    description: Max retries on 429/5xx before failing the request.

  # -------------------------------------------------------------------
  # Source-specific tuning
  # -------------------------------------------------------------------

  - name: lookback_days
    type: integer
    required: false
    default: 7
    description: >-
      Days of history to fetch for incremental objects on first run (no prior
      cursor). Also controls the duration param on count endpoints.
      Mist retains detailed client and visit history for up to 30 days.

  - name: fan_out_max_workers
    type: integer
    required: false
    default: 8
    description: >-
      Max concurrent threads for per-site (and per-map) fan-out.
      The shared rate_limit_qps bucket limits effective throughput.

  - name: site_filter
    type: string
    required: false
    default: ""
    description: >-
      Comma-separated site name substrings (case-insensitive) to restrict
      history and live-occupancy fan-out (zone_visits, zone_visits_by_zone,
      clients_search, clients, map_clients, unconnected_clients,
      assets, sdkclients, guests, guests_search).
      Empty = all sites. Space-model objects (maps, zones, site_settings, etc.)
      always fetch for all sites regardless of this filter.
      Example: "HQ,Campus".

  # -------------------------------------------------------------------
  # Object selection (single parameter for all objects)
  # -------------------------------------------------------------------

  - name: enabled_objects
    type: string
    required: false
    default: ""
    description: >-
      Comma-separated list of object names to sync. Empty (default) means ALL
      24 objects — 14 primary + 10 optional — are synced. Optional objects that
      return empty or error from the Mist API fail gracefully (warning logged,
      run continues). To sync a specific subset, list object names explicitly.
      Example (space model only):
        "sites,maps,zones,zone_stats,site_settings,site_wlans"
      Example (movement data only):
        "sites,zone_visits,zone_visits_by_zone,clients_search"

  - name: full_load_interval_hours
    type: integer
    required: false
    default: 0
    description: >-
      Minimum hours between full-load syncs for reference/config objects
      (org, sites, maps, zones, inventory, etc. — load_strategy="full").
      0 (default) = always run every object on every job trigger.
      Set to 24 when running the job hourly: reference objects run once per day
      while snapshot objects (device_stats, clients, map_clients,
      unconnected_clients) and incremental objects (zone_visits, clients_search,
      etc.) still run on every trigger.
      Objects whose last successful run was fewer than this many hours ago are
      silently skipped (logged as INFO, counted in objects_skipped, no API call
      made, run is still counted as success).
